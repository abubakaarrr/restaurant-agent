<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — {{ restaurant }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-icon">🍽️</span>
        <div>
          <h1>{{ restaurant }}</h1>
          <p>AI Receptionist Dashboard</p>
        </div>
      </div>

      <p class="login-subtitle">Sign in with your restaurant credentials to manage calls, reservations, and menu.</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form class="login-form" method="post" action="/login" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus
            placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required
            placeholder="Enter password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-save login-submit">Sign in</button>
      </form>
    </div>
  </div>

</body>
</html>
