<VirtualHost *:80>
    ServerName agent.servicesground.com
    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName agent.servicesground.com

    SSLEngine on
    # These paths are created by Certbot. Run:
    #   sudo certbot --apache -d agent.servicesground.com
    # (or certonly) to generate them if this subdomain isn't covered yet.
    SSLCertificateFile      /etc/letsencrypt/live/agent.servicesground.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/agent.servicesground.com/privkey.pem

    # ── Reverse proxy to the Dockerised app ──
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 900

    # Baseline browser protections. Add the client website's separate CSP at
    # that website; this vhost serves the operator dashboard.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(self)"

    # Legacy Vapi rollback only. Keep SSE unbuffered while the flag is enabled.
    SetEnv proxy-sendchunked 1
    SetEnv proxy-nokeepalive 0

    # ── WebSocket tunnel for the Retell custom-LLM endpoint ──
    # Retell connects to wss://.../retell-ws/<call_id>. This upgrades the
    # connection to a real WebSocket and forwards it to the app. These rules
    # MUST come before the generic "ProxyPass /" below, or the HTTP proxy
    # swallows the request and the socket connects but never exchanges frames.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/retell-ws/(.*)$ ws://127.0.0.1:8000/retell-ws/$1 [P,L]

    ProxyPass        /retell-ws/ ws://127.0.0.1:8000/retell-ws/
    ProxyPassReverse /retell-ws/ ws://127.0.0.1:8000/retell-ws/

    # The rollback WebSocket URL contains a secret query token. Do not place it
    # in the access log. Managed Conversation Flow does not use this route.
    SetEnvIf Request_URI "^/retell-ws/" dontlog

    # ── Everything else over plain HTTP ──
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Pass the real client info to the app
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/restaurant-agent-error.log
    CustomLog ${APACHE_LOG_DIR}/restaurant-agent-access.log combined env=!dontlog
</VirtualHost>
