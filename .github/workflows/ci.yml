name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: restaurant-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: preflight-and-local-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Ensure required tooling is available
        run: |
          python -m pytest --version
          docker --version

      - name: Compile checks and diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m compileall -q app scripts
          python -m compileall -q tests
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git show --check --oneline HEAD
          else
            git diff --check "$BASE_SHA...$GITHUB_SHA"
          fi

      - name: Focused restaurant/phase-2 regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q -p pytest_asyncio.plugin \
            tests/test_phase2_follow_up.py \
            tests/test_phase2_voice_humanization.py \
            tests/test_restaurant_knowledge_foundation.py

      - name: Full non-DB test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q -p pytest_asyncio.plugin \
            --ignore tests/test_database_integration.py \
            --ignore tests/test_app_security_integration.py

      - name: Configuration and security safety checks
        run: |
          python -m pytest -q -p pytest_asyncio.plugin \
            tests/test_config_security.py \
            tests/test_bootstrap_secrets.py

      - name: Build Docker image with immutable SHA tag
        run: |
          docker build --pull -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Collect build evidence
        run: |
          mkdir -p artifacts/ci-evidence
          printf 'sha=%s\n' "${{ github.sha }}" > artifacts/ci-evidence/build-meta.txt
          printf 'image=ghcr.io/%s:%s\n' "${{ github.repository }}" "${{ github.sha }}" >> artifacts/ci-evidence/build-meta.txt
          docker image inspect ghcr.io/${{ github.repository }}:${{ github.sha }} >> artifacts/ci-evidence/image.json

      - uses: actions/upload-artifact@v4
        with:
          name: ci-image-evidence-${{ github.sha }}
          path: artifacts/ci-evidence/

  integration:
    name: postgres-legacy-integration-suite
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: restaurant_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d restaurant_agent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Apply schema and seed test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/restaurant_agent
        run: |
          python scripts/migrate.py --initialize-schema
          python db/seed.py

      - name: Integration tests against isolated PostgreSQL
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          RUN_DB_INTEGRATION: "1"
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/restaurant_agent
        run: |
          python -m pytest -q -p pytest_asyncio.plugin \
            tests/test_database_integration.py \
            tests/test_app_security_integration.py
